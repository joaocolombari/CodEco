[project]
name = "codeco-experiment"
version = "0.1.0"
description = "Independent execution environment for the CodEco experiment"
requires-python = "==3.12.*"
dependencies = [
    "birdnet==1.5.0",
    "birdnetlib==0.18.1",
    "librosa==0.11.0",
    "matplotlib==3.10.8",
    "numpy==1.26.4",
    "pandas==2.3.3",
    "psutil>=7.2.2",
    "pyarrow==18.1.0",
    "scikit-image==0.26.0",
    "scikit-learn==1.8.0",
    "scikit-maad==1.5.2",
    "scipy==1.17.1",
    "soundfile==0.13.1",
    "soxr==0.5.0.post1",
    "tensorflow==2.21.0",
    "tensorflow-hub==0.16.1",
    "tf-keras==2.21.0",
    "thop==0.1.1.post2209072238",
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "tqdm==4.70.1",
    "transformers==5.23.0",
    "iterative-stratification>=0.1.9",
    "setuptools<81",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeco"]

[tool.codeco.environment]
uv-version = "0.12.0"

[project.optional-dependencies]
# CUDA is an accelerator, not an installation requirement.  CPU-only hosts
# install the base project; Linux GPU hosts may opt in with `uv sync --extra gpu`.
gpu = ["tensorflow[and-cuda]==2.21.0"]

[project.scripts]
codeco = "codeco.main:main"
